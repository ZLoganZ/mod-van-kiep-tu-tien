id: su_do
name: Sư Đồ Truyền Thừa
version: 1.3.3
api_version: 1
author: Antigravity & Tu Tiên Giả
description: |
  Hòa nhập tự nhiên vào thế giới tu tiên với hệ thống Sư Đồ & Nhân Mạch chính tông:
  - Tích hợp toàn diện vào Bảng Nhân Vật (Tab Sư Môn) & Khung Nơi Chốn: Quản trị đồ đệ, truyền công, ban thưởng trực tiếp không cần rời mạch game.
  - Kết nối sâu Nhân Mạch (N): Đồ đệ hiển thị sống động trong mạng lưới quan hệ thế giới (Tri kỷ, Bằng hữu, Kẻ phản bội ma hóa, Đã khuất) kèm danh xưng chân truyền chính thức.
  - Đạo Tràng & Sư Đồ Đồng Lòng: Phân công chức sự đệ tử (Tụ linh, Dược viên, Đan phòng, Hộ tông kiếm trận) trợ chiến giảm sát thương và tương trợ đột phá.
  - Xuất Sơn Lịch Luyện & Bí Cảnh: Đệ tử chu du hồng trần, gửi thư báo sự vụ và mang về kỳ trân dị bảo dâng sư tôn.
  - Nội Môn Luận Kiếm & Đạo Tâm: Tỉ thí võ học tranh đoạt vị trí Đại Sư Huynh / Đại Sư Tỷ; xử lý biến cố đố kỵ và nghịch đồ ma hóa.
  - HUD Mini-Dock: Tiện ích nổi theo dõi cấp tốc tình hình sư môn.

options:
  - key: ti_le_ky_ngo
    label: Tần suất kỳ ngộ thu đồ
    hint: Xác suất bắt gặp thiếu niên, cô nhi bái sư khi chu du thế giới
    type: choice
    default: thuong
    choices:
      - { value: it, label: Hiếm gặp (10%) }
      - { value: thuong, label: Bình thường (25%) }
      - { value: nhieu, label: Thường xuyên (50%) }

  - key: thong_bao_su_mon
    label: Thông báo sự kiện sư môn
    hint: Báo popup ngắn khi đệ tử đột phá hoặc kết thúc lịch luyện
    type: bool
    default: true

script: main.js
