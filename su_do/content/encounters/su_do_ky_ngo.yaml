- id: ev.su_do_gap_co_nhi
  kind: su_kien
  ten: Cô nhi có linh căn
  tags:
    noi: [hoang_da, thon, phuong_thi]
    canh_gioi: [1, 2, 3, 4]
    tinh_chat: [co_duyen]
  weight: 2
  text: >
    Trên đường đi qua {dia_danh}, ngươi bắt gặp một thiếu niên quần áo rách rưới đang ngồi thiền dưới bóng cây cổ thụ.
    Khí tức quanh thân cậu bé mơ hồ dẫn động thiên địa linh khí, rõ ràng là một khối ngọc thô chưa gọt giũa!
  choices:
    - text: Tiếp cận và ngỏ ý thu làm đồ đệ
      effects:
        - time: 0.05
        - log: 'Ngươi bước tới xoa đầu thiếu niên, dò xét linh căn. Cậu bé mừng rỡ sụp lạy, bái ngươi làm sư tôn!'
        - add_item: item.su_do_tin_vat
    - text: Để lại chút lương thực rồi rời đi
      effects:
        - time: 0.01
        - log: 'Con đường tu tiên đầy trắc trở, ngươi khẽ thở dài, để lại mười lượng bạc rồi quay lưng bước tiếp.'

- id: ev.su_do_tan_tu_cau_dao
  kind: su_kien
  ten: Tán tu xin bái sư
  tags:
    noi: [phuong_thi, tong_mon, thanh]
    canh_gioi: [1, 2, 3, 4]
    tinh_chat: [co_duyen]
  weight: 2
  text: >
    Tại {dia_danh}, một vị tán tu trẻ tuổi nghe danh tiếng và phong thái tiên phong đạo cốt của ngươi,
    liền quỳ phục ven đường ba ngày ba đêm, cầu xin được bái nhập môn hạ để nghe giảng đạo.
  choices:
    - text: Cảm động trước lòng kiên trì, nhận làm ký danh đệ tử
      effects:
        - time: 0.08
        - tu_vi: 0.5
        - log: 'Ngươi đỡ người ấy dậy, ban một lời chỉ điểm sơ cơ. Người ấy cảm kích rơi lệ, nguyện làm trâu làm ngựa báo đáp sư môn.'
    - text: Lắc đầu từ chối, duyên phận chưa tới
      effects:
        - time: 0.01
        - log: 'Ngươi phất tay áo nhẹ nhàng rời đi: "Đạo pháp tùy duyên, ngươi hãy tự mình tìm kiếm cơ duyên khác đi."'

- id: ev.su_do_kiep_sau_tuong_phung
  kind: su_kien
  ten: Tiền duyên chưa dứt
  tags:
    noi: [tong_mon, phuong_thi, bi_canh]
    canh_gioi: [0, 1, 2]
    tinh_chat: [co_duyen]
  weight: 1
  text: >
    Ngươi chợt thấy một vị lão giả tiên phong đạo cốt đứng ngắm nhìn ngươi thật lâu.
    Lão giả run rẩy tiến lại, nhìn vào tín vật trên người ngươi mà nước mắt lưng tròng:
    "Khí tức này... thần hồn này... Quả nhiên là Ân Sư chuyển thế! Đồ nhi bái kiến Sư Tôn!"
  choices:
    - text: Nhận lại đệ tử năm xưa
      effects:
        - time: 0.05
        - tu_vi: 5.0
        - add_item: item.su_do_ho_mach_dan
        - log: 'Đệ tử kiếp trước quỳ lạy dâng lên đan dược và linh vật năm xưa ngươi để lại, nghẹn ngào hộ vệ sư tôn ở kiếp mới!'

- id: ev.su_do_thien_tai_bai_su
  kind: su_kien
  ten: Thiên tài dị cốt cầu đạo
  tags:
    noi: [phuong_thi, tong_mon, thanh, bi_canh]
    canh_gioi: [2, 3, 4, 5]
    tinh_chat: [co_duyen]
  weight: 2
  text: >
    Giữa chốn {dia_danh}, một thiếu niên khí vũ phi phàm, toàn thân lượn lờ dị sắc linh quang đang khoanh tay nhìn trời.
    Vừa thấy bóng dáng ngươi ngự phong lướt qua, thiếu niên hai mắt sáng rực, tiến đến bái phục:
    "Đệ tử từ nhỏ mang dị thể, tìm kiếm danh sư khắp cửu châu. Nay chiêm ngưỡng phong thái Sư Tôn, nguyện bái nhập môn đình!"
  choices:
    - text: Nhận làm thân truyền đệ tử, ban tặng ngọc bài hộ mệnh
      effects:
        - time: 0.05
        - tu_vi: 2.0
        - add_item: item.su_do_ho_menh_ngoc_bai
        - log: 'Ngươi xoa đầu thiếu niên, ban phong hiệu thân truyền. Cả môn phái bừng sáng khí vận thiên tài!'
    - text: Ban tặng linh thạch khích lệ rồi rời đi
      effects:
        - time: 0.02
        - log: 'Ngươi mỉm cười gật đầu: "Tư chất ngươi bất phàm, tự có cơ duyên lớn nơi phương xa, hãy vững tâm tu luyện."'

- id: ev.su_do_de_tu_cau_cuu
  kind: su_kien
  ten: Đệ tử phát phù cầu cứu
  tags:
    noi: [hoang_da, bi_canh, cam_dia]
    canh_gioi: [1, 2, 3, 4]
    tinh_chat: [hiem_hoa]
  weight: 2
  text: >
    Trong lúc tĩnh tu, Vạn Lý Truyền Âm Phù trên người ngươi bỗng nhiên rực cháy!
    Âm thanh gấp gáp của đệ tử vang vọng trong thần thức:
    "Sư Tôn cứu mạng! Đệ tử bị mấy tên tà tu vây khốn tại {dia_danh}, trận pháp sắp vỡ rồi!"
  choices:
    - text: Ngự kiếm phá không, giáng lâm trảm sát tà tu cứu đồ đệ
      effects:
        - time: 0.05
        - tu_vi: 1.5
        - add_item: item.su_do_nghich_do_ma_hoan
        - log: 'Kiếm quang xé rách mây mù, ngươi trảm sát toàn bộ tà tu! Đệ tử quỳ rạp ôm chân ngươi cảm kích khóc ròng.'
    - text: Cấp tốc kích hoạt trận phù từ xa hộ tống đồ đệ trốn thoát
      effects:
        - time: 0.03
        - log: 'Ngươi từ xa kích phát bí phù, tạo sương mù dẫn đệ tử phá vây thoát nạn bình an trở về sư môn.'

- id: ev.su_do_tang_bao
  kind: su_kien
  ten: Đệ tử dâng hiến kỳ trân
  tags:
    noi: [tong_mon, dong_phu, thanh]
    canh_gioi: [1, 2, 3, 4]
    tinh_chat: [co_duyen]
  weight: 2
  text: >
    Vừa trở về {dia_danh}, đệ tử tông môn đã hớn hở chạy ra nghênh đón, hai tay dâng lên một chiếc hộp ngọc cổ xưa:
    "Khởi bẩm Sư Tôn, đợt viễn du vừa rồi đệ tử may mắn tìm được cổ di tích động phủ tiền bối, xin dâng bảo vật này để Sư Tôn gia tăng tu vi!"
  choices:
    - text: Nhận bảo vật và xoa đầu khen ngợi
      effects:
        - time: 0.02
        - tu_vi: 3.5
        - add_item: item.su_do_duoc_dien_linh_thoc
        - log: 'Ngươi mỉm cười nhận lễ vật, ban lời khen ngợi. Đệ tử vô cùng tự hào và càng thêm gắn bó với bổn môn!'
    - text: Chỉ nhận một nửa, để lại cho đệ tử bồi bổ căn cơ
      effects:
        - time: 0.02
        - tu_vi: 1.5
        - log: 'Ngươi khuyên bảo đệ tử tự mình bồi dưỡng đạo cơ. Đệ tử cảm phục đức độ vô lượng của Sư Tôn.'

- id: ev.su_do_luan_dao_dinh_cao
  kind: su_kien
  ten: Sư đồ luận đạo thăng hoa
  tags:
    noi: [tong_mon, dong_phu, dinh_nui]
    canh_gioi: [2, 3, 4, 5]
    tinh_chat: [co_duyen]
  weight: 1
  text: >
    Dưới trăng sáng nơi {dia_danh}, đệ tử xuất sắc nhất của ngươi pha một ấm Tuyết Liên Linh Trà,
    thành kính thỉnh giáo huyền cơ thiên địa. Lời qua ý lại, đạo tắc cộng hưởng khiến mây trời biến ảo!
  choices:
    - text: Cùng đệ tử đốn ngộ suốt bảy ngày đêm
      effects:
        - time: 0.1
        - tu_vi: 6.0
        - add_item: item.su_do_tuyet_lien_tra
        - log: 'Một trận đốn ngộ kinh thiên động địa! Đạo tâm của ngươi cùng đệ tử đại thăng tiến, chân nguyên tinh thuần thêm một bậc.'
    - text: Điểm hóa cốt lõi rồi để đệ tử tự mình ngẫm nghĩ
      effects:
        - time: 0.02
        - tu_vi: 2.0
        - log: 'Ngươi lưu lại một đạo thần niệm chỉ điểm, đệ tử bừng tỉnh đại ngộ, lập tức lui về bế quan củng cố đạo cảnh.'
